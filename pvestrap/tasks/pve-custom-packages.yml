---
- name: Download pve-container on control node
  ansible.builtin.get_url:
    url: "https://github.com/USTC-vlab/pve-container/releases/download/6.1.14%2Bvlab3/pve-container_6.1.14+vlab3_all.deb"
    dest: "/tmp/pve-container.deb"
    mode: "0644"
    checksum: "sha256:912a26777491e2b56b6112fa01cd3f0945c510c32db67ed02fd446567d3dba17"
  delegate_to: localhost
  run_once: true

- name: Copy deb to remote
  ansible.builtin.copy:
    src: "/tmp/pve-container.deb"
    dest: "/tmp/pve-container.deb"
    mode: "0644"

- name: Unhold pve-container
  ansible.builtin.dpkg_selections:
    name: pve-container
    selection: install

- name: Install pve-container
  ansible.builtin.apt:
    deb: "/tmp/pve-container.deb"

- name: Hold pve-container
  ansible.builtin.dpkg_selections:
    name: pve-container
    selection: hold

- name: Remove old hack
  ansible.builtin.apt:
    name:
      - pve-lxc-btrfs
    state: absent

- name: Cleanup
  ansible.builtin.file:
    path: "/tmp/pve-container.deb"
    state: absent
