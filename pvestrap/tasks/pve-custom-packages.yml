---
- name: Download pve-container on control node
  ansible.builtin.get_url:
    url: "https://github.com/USTC-vlab/pve-container/releases/download/6.1.14%2Bvlab1/pve-container_6.1.14+vlab1_all.deb"
    dest: "/tmp/pve-container.deb"
    mode: "0644"
    checksum: "sha256:394062d6723e75db7e2ee79f3c9314a289b9fc5eb3e279dabf12258a7b69df3f"
  delegate_to: localhost
  run_once: true

- name: Copy deb to remote
  ansible.builtin.copy:
    src: "/tmp/pve-container.deb"
    dest: "/tmp/pve-container.deb"
    mode: "0644"

- name: Unhold pve-container
  ansible.builtin.dpkg_selections:
    name: pve-container
    selection: install

- name: Install pve-container
  ansible.builtin.apt:
    deb: "/tmp/pve-container.deb"

- name: Hold pve-container
  ansible.builtin.dpkg_selections:
    name: pve-container
    selection: hold

- name: Remove old hack
  ansible.builtin.apt:
    name:
      - pve-lxc-btrfs
    state: absent

- name: Cleanup
  ansible.builtin.file:
    path: "/tmp/pve-container.deb"
    state: absent
